# Container-side nginx config (NOT the VPS-host nginx). Lives at
# /etc/nginx/conf.d/default.conf inside the image and serves the SPA
# bundle to whatever upstream proxies in (e.g. the VPS-host nginx).
#
# SPA fallback: any URL that doesn't match a real file (e.g. /login,
# /orders/123) returns index.html so React Router can resolve the route
# client-side. Without this, browser refresh on a deep link returns 404.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed static assets — cache forever. Vite emits new hashes on
    # every build so cache busting is automatic.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Runtime config and SPA entry — short cache so deploys are picked up
    # promptly. config.js is rewritten by the container entrypoint on each
    # start; index.html references it.
    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything else: serve the file if it exists, otherwise fall back
    # to index.html so the SPA router can handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
