name: Deploy OrbitX Admin Frontend

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'development'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Image name must match docker-compose.yml's services.admin-frontend.image
          # (was orbitx-admin in this workflow but compose pulls orbitx-admin-frontend
          # — `docker compose up` would fail with "image not found" until aligned).
          IMAGE=ghcr.io/${{ github.repository_owner }}/orbitx-admin-frontend:latest
          # Vite envs are baked into the bundle at build time — pass them
          # as build args so the production bundle points at the prod API.
          docker build \
            --build-arg VITE_API_URL=https://api.orbitxng.com/api/v1 \
            -t $IMAGE .
          docker push $IMAGE

      - name: Copy project files to server
        # Pinned to a tagged release — `@master` tried to fetch its
        # drone-scp binary anonymously from GitHub releases and hit a 403
        # rate limit. v0.1.7+ passes GITHUB_TOKEN automatically.
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.SERVER_USER }}/orbitx-admin"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR=/home/${{ secrets.SERVER_USER }}/orbitx-admin

            echo "Creating deployment directory..."
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            echo "Logging into GitHub Container Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling latest image..."
            docker pull ghcr.io/${{ github.repository_owner }}/orbitx-admin-frontend:latest

            echo "Stopping existing container..."
            docker compose down || true

            # docker-compose.yml declares `orbitx-network` as external because
            # the backend and other services on this VPS share it. Create it
            # on first deploy / fresh VPS — no-op on subsequent runs.
            echo "Ensuring shared orbitx-network exists..."
            docker network create orbitx-network 2>/dev/null || true

            echo "Starting service with docker compose..."
            docker compose up -d

            echo "Waiting for service to be ready..."
            sleep 5

            echo "Checking service status..."
            docker compose ps

            echo "Checking health..."
            curl -f http://localhost:4100/health || echo "Health check failed"

            echo "Checking logs..."
            docker compose logs admin-frontend --tail 10
