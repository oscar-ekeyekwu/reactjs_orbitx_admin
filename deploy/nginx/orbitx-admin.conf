# /etc/nginx/sites-available/orbitx-admin
#
# Reverse proxy: public HTTP :80 on the VPS → admin SPA container :4100
# (port 4100 is published by orbitx-admin's docker-compose.yml).
#
# Install steps on the VPS:
#   1. Copy this file to /etc/nginx/sites-available/orbitx-admin
#   2. sudo ln -s /etc/nginx/sites-available/orbitx-admin /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#
# Then issue the cert:
#   sudo certbot --nginx -d admin.orbitxng.com
#
# Certbot rewrites this server block to listen 443 ssl and adds an HTTP→HTTPS
# redirect automatically.

upstream orbitx_admin {
    server 127.0.0.1:4100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name admin.orbitxng.com;

    # Forward client info to the SPA container's nginx. The SPA itself does
    # not consume these headers, but logs in the container will show real
    # client IPs instead of 127.0.0.1.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # SPA bundle is small; default body limits are fine. No file uploads here.

    # Long-poll fallback paths if any (none today, but cheap insurance).
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Compress text payloads — Vite output is already minified but gzip on the
    # wire is still a meaningful win for the initial JS bundle.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/html
        text/plain
        text/xml
        image/svg+xml;
    gzip_proxied any;

    # Cache static assets aggressively. Vite emits hashed filenames for JS/CSS
    # so cache-busting happens automatically on every new build.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        proxy_pass http://orbitx_admin;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry — short cache so deploys are picked up promptly.
    location = /index.html {
        proxy_pass http://orbitx_admin;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything else (including unknown paths for React Router) hits the
    # SPA container. The container's nginx is already patched to fall back
    # to /index.html on missing files (see Dockerfile).
    location / {
        proxy_pass http://orbitx_admin;
    }
}
