# /etc/nginx/sites-available/orbitx-admin
#
# Reverse proxy + TLS termination: public :80/:443 on the VPS → admin SPA
# container :4100 (port 4100 is published by orbitx-admin's
# docker-compose.yml).
#
# Install steps on the VPS:
#   1. sudo ./generate-self-signed-cert.sh
#      (creates the placeholder cert this file points at — see script
#      header for details)
#   2. Copy this file to /etc/nginx/sites-available/orbitx-admin
#   3. sudo ln -s /etc/nginx/sites-available/orbitx-admin /etc/nginx/sites-enabled/
#   4. sudo nginx -t
#   5. sudo systemctl reload nginx
#
# Swap in a real cert once DNS/HTTP-01 is ready:
#   sudo certbot --nginx -d admin.orbitxng.com
# certbot finds the existing `listen 443 ssl` block for this server_name
# and rewrites the ssl_certificate directives in place — no need to touch
# the location blocks below.

upstream orbitx_admin {
    server 127.0.0.1:4100;
    keepalive 32;
}

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;

    server_name admin.orbitxng.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name admin.orbitxng.com;

    # Self-signed cert from generate-self-signed-cert.sh — clients will see
    # a trust warning until this is swapped for a real cert via certbot
    # (see header comment above).
    ssl_certificate     /etc/ssl/orbitx/admin.orbitxng.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/orbitx/admin.orbitxng.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Forward client info to the SPA container's nginx. The SPA itself does
    # not consume these headers, but logs in the container will show real
    # client IPs instead of 127.0.0.1.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # SPA bundle is small; default body limits are fine. No file uploads here.

    # Long-poll fallback paths if any (none today, but cheap insurance).
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Compress text payloads — Vite output is already minified but gzip on the
    # wire is still a meaningful win for the initial JS bundle.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/html
        text/plain
        text/xml
        image/svg+xml;
    gzip_proxied any;

    # Cache static assets aggressively. Vite emits hashed filenames for JS/CSS
    # so cache-busting happens automatically on every new build.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        proxy_pass http://orbitx_admin;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry — short cache so deploys are picked up promptly.
    location = /index.html {
        proxy_pass http://orbitx_admin;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything else (including unknown paths for React Router) hits the
    # SPA container. The container's nginx is already patched to fall back
    # to /index.html on missing files (see Dockerfile).
    location / {
        proxy_pass http://orbitx_admin;
    }
}
